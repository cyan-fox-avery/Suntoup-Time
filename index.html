<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Suntoup Standard Time</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1>Suntoup Standard Time</h1>

        <section class="clock">

            <h2 id="earth-label">
                Local Time (Earth)
            </h2>

            <div id="earth-time">
                --:--:--
            </div>

        </section>

        <section class="clock suntoup-clock">

            <h2>Suntoup</h2>

            <div class="analog-clock" aria-label="Analog Suntoup clock">

                <div id="clock-markers"></div>

                <div class="clock-hand hour-hand" id="hour-hand"></div>
                <div class="clock-hand minute-hand" id="minute-hand"></div>
                <div class="clock-hand second-hand" id="second-hand"></div>

                <div class="clock-centre"></div>

            </div>

            <div id="suntoup-time">
                --:--:--
            </div>

        </section>

    </main>

    <script src="clock.js"></script>

</body>
</html>
