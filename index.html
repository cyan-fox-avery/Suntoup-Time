<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Suntoup Standard Time</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1>Suntoup Standard Time</h1>

        <section class="clock">

            <h2 id="earth-label">
                Local Time (Earth)
            </h2>

            <div id="earth-time">
                --:--:--
            </div>

        </section>

        <section class="clock">

            <h2>Suntoup</h2>

            <div id="suntoup-time">
                --:--:--
            </div>

        </section>

    </main>

    <script src="clock.js"></script>

</body>
</html>
