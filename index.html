<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080a0f"
    >

    <title>SST | Suntoup Standard Time</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <section
            class="clock suntoup-clock"
            aria-label="Suntoup Standard Time clock"
        >

            <header class="instrument-heading">

                <h1>SST</h1>

                <p>
                    Suntoup Standard Time
                </p>

            </header>

            <div
                class="analog-clock"
                aria-label="Analog 40-hour Suntoup clock"
            >

                <div id="clock-markers"></div>

                <div
                    class="clock-hand hour-hand"
                    id="hour-hand"
                ></div>

                <div
                    class="clock-hand minute-hand"
                    id="minute-hand"
                ></div>

                <div
                    class="clock-hand second-hand"
                    id="second-hand"
                ></div>

                <div class="clock-centre"></div>

            </div>

            <div
                id="suntoup-time"
                aria-label="Digital Suntoup time"
            >
                --:--:--
            </div>

            <p class="instrument-note">
                40 hours · 50 minutes · 50 seconds
            </p>

        </section>

    </main>

    <script src="clock.js"></script>

</body>
</html>
